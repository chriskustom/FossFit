name: fossfit
description: Track gym progress, visualize graphs, enjoy offline support & timers
publish_to: none
version: 1.0.0
environment:
  sdk: ">=3.2.6 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  drift: ^2.28.1
  path_provider: ^2.1.2
  path: ^1.8.3
  csv: ^8.0.0
  intl: ^0.20.2
  fl_chart: ^1.0.0
  permission_handler: ^13.0.2
  provider: ^6.1.1
  dynamic_color: ^1.7.0
  sqlite3: ^3.5.2
  file_picker: ^13.1.0
  share_plus: ^13.3.0
  audioplayers: ^6.5.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.2.6
  badges: ^3.1.2
  flutter_local_notifications: ^22.3.1
  msvcredist:
    git:
      url: https://github.com/insertjokehere/flutter_msvcredist.git
      ref: main
  timeago: ^3.2.2
  sqlite3_web: ^0.9.4
  sticky_headers: ^0.3.0+2
  table_calendar: ^3.2.1
  flutter_local_notifications_platform_interface: ^12.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  drift_dev: ^2.28.1
  build_runner: ^2.6.0
  flutter_launcher_icons: ^0.14.4
  msix:
    git:
      url: https://github.com/insertjokehere/msix.git
      ref: msvc_redist
flutter:
  uses-material-design: true
  assets:
    - assets/
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/ic_launcher.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/ic_launcher.png
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: assets/ic_launcher.png
    icon_size: 48
  macos:
    generate: true
    image_path: assets/ic_launcher.png
  linux:
    generate: true
    image_path: assets/ic_launcher.png
msix_config:
  msstore_appId: 9P13THVK7F69
  display_name: FossFit
  publisher_display_name: ChrisKustom
  identity_name: KustomSoftware.FossFit
  msix_version: 1.0.175.0
  logo_path: assets/ic_launcher.png
  trim_logo: false
  publisher: CN=BB0811CB-EED5-441C-BE1B-D31F391F76DE
  store: true
